[project]
name = "erg-analytics"
version = "0.1.0"
description = "Concept2 Logbook ingestion and derived-metrics data layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "cryptography>=43",
    "tzdata>=2024.1",
]

[project.scripts]
erg = "erg.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
