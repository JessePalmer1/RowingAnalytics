services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: erg
      POSTGRES_PASSWORD: erg
      POSTGRES_DB: erg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
